[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dassuite"
version = "1.0.0"
description = "DAS Suite: exact locked closure manager for public DAS repositories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "DAS Suite Contributors" }
]
dependencies = [
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
]

[project.scripts]
dassuite = "dassuite.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dassuite*"]
