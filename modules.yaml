# Public DAS Suite module catalog
defaultGitBase: "https://github.com/AzzCraft"

modules:
  - id: das-standard
    repo: "das-standard"
    path: "src/das-standard"
    tier: "oss"
    required: true
    role: "standard_repo"
    closureRef: "standard"

  - id: dasops
    repo: "dasops"
    path: "src/dasops"
    tier: "oss"
    required: true
    role: "factory_repo"
    closureRef: "factory"

  - id: cadence-oss
    repo: "cadence-oss"
    path: "src/cadence-oss"
    tier: "oss"
    required: true
    role: "verify_runtime_repo"
    closureRef: "verifyRuntime"
